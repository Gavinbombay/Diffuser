[package]
name = "lane-router"
version = "0.3.0"
edition = "2021"
autotests = false
license = "Apache-2.0"
description = "Diffuser: scalable multi-worker CPU/CUDA resource router, typed SDK, CLI, and MCP fleet server."

[dependencies]
libc = "0.2"
regex = "1"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
subtle = "2"
jsonschema = { version = "0.57", default-features = false }

reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.40", features = ["bundled"] }
zeroize = "1"

[[bin]]
name = "lane-router"
path = "src/main.rs"

[[bin]]
name = "diffuser"
path = "src/main.rs"

[[bin]]
name = "lanes-ctl"
path = "src/bin/lanes-ctl.rs"

[[bin]]
name = "crew-memory-bridge"
path = "src/bin/crew-memory-bridge.rs"

[profile.release]
opt-level = 2

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
